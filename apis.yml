name: Prelay
description: >-
  Prelay was a deal collaboration ("team selling") platform that helped B2B revenue
  teams coordinate the internal stakeholders behind complex enterprise deals —
  sales engineers, legal, deal desk, finance, and leadership — inside a shared
  workspace that plugged into the CRM. Founded 2019 in San Francisco (Y Combinator
  W20), it was a SaaS application aimed at sales and revenue operations, not a
  developer/API product. The company has since ceased operations: Y Combinator
  lists Prelay as Inactive, Crunchbase records it as permanently closed, the
  github.com/prelay organization was archived on 2025-10-16 with zero public
  repositories, and as of 2026-08-14 prelay.com and www.prelay.com no longer
  complete a TLS handshake (the Webflow certificate has been deprovisioned) while
  app.prelay.com answers 404 for every path. No public developer portal, API
  reference, OpenAPI/AsyncAPI specification, SDK, MCP server or agent card ever
  existed, and no api./docs./developers. subdomain resolves. Prelay was surfaced as
  a portfolio company of General Catalyst and added to the API Evangelist network.
