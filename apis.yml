name: Prelay
description: >-
  Prelay is a deal collaboration ("team selling") platform that helps B2B revenue
  teams coordinate the internal stakeholders behind complex enterprise deals —
  sales engineers, legal, deal desk, finance, and leadership — inside a shared
  workspace that plugs into the CRM. It is a SaaS application aimed at sales and
  revenue operations, not a developer/API product: as of this enrichment pass no
  public developer portal, API reference, OpenAPI/AsyncAPI specification, SDKs, or
  developer subdomains (api./developers./docs.) were found. Prelay was surfaced as
  a portfolio company of General Catalyst and added to the API Evangelist network.
